<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Global Rocket Launches Visualization</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles/styles.css" />
  </head>

  <body>
    <div id="infoPanel"></div>
    <canvas id="outcomeChart" width="220" height="220"></canvas>
    <canvas id="countryChart" width="360" height="220"></canvas>

    <script type="module" src="src/main.js"></script>
    <div id="time-ui">
      <input
        type="range"
        id="yearSlider"
        min="1957"
        max="2022"
        value="2000"
        step="1"
      />
      <div id="yearLabel">Year: 2000</div>
      <canvas id="launchChart" width="800" height="200"></canvas>
    </div>
  </body>
</html>
