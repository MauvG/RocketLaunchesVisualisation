<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Global Rocket Launches Visualization</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles/styles.css" />
  </head>

  <body>
    <h1 class="mainTitle">Global Rocket Launches 1957-2022</h1>

    <div id="app">
      <div id="scene-container"></div>

      <div id="allTimeLeft">
        <canvas id="successFailureChart" width="450" height="200"></canvas>
      </div>

      <div id="allTimeRight">
        <div class="statsTitle">All Time Stats</div>

        <div class="statRow">
          <span class="label">Country with most launches</span>
          <span class="value" id="topCountry"></span>
        </div>

        <div class="statRow">
          <span class="label">Company with most launches</span>
          <span class="value" id="topCompany"></span>
        </div>

        <div class="divider"></div>

        <div class="statRow">
          <span class="label">Country with most failures</span>
          <span class="value" id="topFailureCountry"></span>
        </div>

        <div class="statRow">
          <span class="label">Company with most failures</span>
          <span class="value" id="topFailureCompany"></span>
        </div>

        <div class="divider"></div>

        <div class="statRow">
          <span class="label">Best success country</span>
          <span class="value" id="bestCountry"></span>
        </div>

        <div class="statRow">
          <span class="label">Best success company</span>
          <span class="value" id="bestCompany"></span>
        </div>
      </div>

      <div id="ui-panel">
        <div id="time-ui">
          <input
            type="range"
            id="yearSlider"
            min="1957"
            max="2022"
            value="2000"
            step="1"
          />
          <div id="playAndYear">
            <button id="playButton">Play</button>
            <div id="yearLabel">Year: 2000</div>
          </div>
        </div>

        <div id="bottomCharts">
          <div class="bottomChart">
            <canvas id="companyChart" width="600px" height="250px"></canvas>
          </div>

          <div class="bottomChart">
            <canvas id="countryChart" width="600px" height="250px"></canvas>
          </div>

          <div class="bottomChart">
            <canvas id="monthlyChart" width="600px" height="250px"></canvas>
          </div>
        </div>
      </div>
    </div>

    <div id="infoPanel"></div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
